services:
  # ── Backend Web Service ──────────────────────────────────────────────────────
  - type: web
    name: project-kalam-backend
    runtime: node
    buildCommand: npm install && npm run db:generate && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Set in Render dashboard — Neon connection string
      - key: JWT_SECRET
        sync: false          # Generate: node -e "require('crypto').randomBytes(32).toString('hex')"
      - key: JWT_REFRESH_SECRET
        sync: false          # Generate: node -e "require('crypto').randomBytes(32).toString('hex')"
      - key: CORS_ORIGIN
        value: https://project-kalam-frontend.onrender.com
      - key: PUBLIC_URL
        value: https://project-kalam-backend.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
      - key: GEMINI_API_KEY
        sync: false          # Set in Render dashboard
      - key: ANTHROPIC_API_KEY
        value: ""

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: static
    name: project-kalam-frontend
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://project-kalam-backend.onrender.com
      - key: VITE_SOCKET_URL
        value: https://project-kalam-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
